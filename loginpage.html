<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VastraHub - Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0A0A0A;
            min-height: 100vh;
        }

        .auth-container {
            display: flex;
            min-height: 100vh;
            background: #0A0A0A;
        }

        /* Left Side - Image */
        .left-side {
            position: relative;
            width: 50%;
            overflow: hidden;
            display: none;
        }

        @media (min-width: 1024px) {
            .left-side {
                display: block;
            }
        }

        .left-side img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.7);
        }

        .left-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, transparent 60%, #0A0A0A);
        }

        .left-content {
            position: absolute;
            bottom: 4rem;
            left: 4rem;
        }

        .left-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            line-height: 1;
            margin-bottom: 0.75rem;
            color: #C5A059;
            font-weight: 300;
        }

        .left-desc {
            font-family: 'Outfit', sans-serif;
            font-size: 0.875rem;
            max-width: 20rem;
            color: #A3A3A3;
            line-height: 1.6;
        }

        /* Right Side - Form */
        .right-side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .form-container {
            width: 100%;
            max-width: 28rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Back Button */
        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2.5rem;
            font-family: 'Outfit', sans-serif;
            font-size: 0.875rem;
            color: #A3A3A3;
            background: none;
            border: none;
            cursor: pointer;
            transition: color 0.3s;
        }

        .back-btn:hover {
            color: #C5A059;
        }

        /* Title & Subtitle */
        .form-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #FFFFF0;
            font-weight: 400;
        }

        .form-subtitle {
            font-family: 'Outfit', sans-serif;
            font-size: 0.875rem;
            margin-bottom: 2.5rem;
            color: #737373;
        }

        /* Google Button */
        .google-btn {
            width: 100%;
            padding: 0.875rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            font-family: 'Outfit', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            background: rgba(255, 255, 240, 0.05);
            border: 1px solid rgba(197, 160, 89, 0.2);
            color: #FFFFF0;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .google-btn:hover {
            opacity: 0.9;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: rgba(197, 160, 89, 0.15);
        }

        .divider-text {
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            color: #737373;
        }

        /* Form */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 0.375rem;
            color: #A3A3A3;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-family: 'Outfit', sans-serif;
            font-size: 0.875rem;
            background: rgba(255, 255, 240, 0.03);
            border: 1px solid rgba(197, 160, 89, 0.15);
            color: #FFFFF0;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: rgba(197, 160, 89, 0.4);
        }

        .form-input::placeholder {
            color: #525252;
        }

        /* Password Input */
        .password-group {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #737373;
            cursor: pointer;
            padding: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 0.875rem;
            margin-top: 0.5rem;
            font-family: 'Outfit', sans-serif;
            font-size: 0.875rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background: #C5A059;
            color: #0A0A0A;
            border: none;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .submit-btn:hover:not(:disabled) {
            opacity: 0.9;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Toggle Text */
        .toggle-text {
            text-align: center;
            margin-top: 2rem;
            font-family: 'Outfit', sans-serif;
            font-size: 0.875rem;
            color: #737373;
        }

        .toggle-btn {
            font-weight: 700;
            color: #C5A059;
            background: none;
            border: none;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .toggle-btn:hover {
            opacity: 0.8;
        }

        /* Icons */
        .icon {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-large {
            width: 18px;
            height: 18px;
        }

        .hidden {
            display: none;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid rgba(197, 160, 89, 0.3);
            color: #FFFFF0;
            font-family: 'Outfit', sans-serif;
            font-size: 0.875rem;
            border-radius: 4px;
            z-index: 1000;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.3s, transform 0.3s;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.error {
            border-color: rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }

        .toast.success {
            border-color: rgba(82, 196, 26, 0.3);
            color: #52c41a;
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(10, 10, 10, 0.3);
            border-top-color: #0A0A0A;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Left Side - Image -->
        <div class="left-side">
            <img src="https://static.prod-images.emergentagent.com/jobs/3f36e4b8-8555-42d1-bdc7-79f7a7ccf260/images/3669777c805f34ef9b6859fb3d0c86a0e7fc035763e1977e06f10672d4a18d0f.png" alt="VastraHub">
            <div class="left-gradient"></div>
            <div class="left-content">
                <h1 class="left-title">VastraHub</h1>
                <p class="left-desc">India's finest traditional sarees & dresses from every state, curated for you.</p>
            </div>
        </div>

        <!-- Right Side - Form -->
        <div class="right-side">
            <div class="form-container">
                <!-- Back Button -->
                <button class="back-btn" onclick="goBack()">
                    <svg class="icon" viewBox="0 0 24 24">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to Home
                </button>

                <!-- Title & Subtitle -->
                <h2 class="form-title" id="formTitle">Welcome Back</h2>
                <p class="form-subtitle" id="formSubtitle">Sign in to explore your collections</p>

                <!-- Google Auth Button -->
                <button class="google-btn" onclick="handleGoogleLogin()">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continue with Google
                </button>

                <!-- Divider -->
                <div class="divider">
                    <div class="divider-line"></div>
                    <span class="divider-text">or</span>
                    <div class="divider-line"></div>
                </div>

                <!-- Email/Password Form -->
                <form class="auth-form" id="authForm" onsubmit="handleSubmit(event)">
                    <!-- Name Field (Hidden for Login) -->
                    <div class="form-group hidden" id="nameGroup">
                        <label class="form-label" for="nameInput">Full Name</label>
                        <input 
                            class="form-input" 
                            type="text" 
                            id="nameInput" 
                            placeholder="Your full name"
                        />
                    </div>

                    <!-- Email Field -->
                    <div class="form-group">
                        <label class="form-label" for="emailInput">Email</label>
                        <input 
                            class="form-input" 
                            type="email" 
                            id="emailInput" 
                            placeholder="you@example.com"
                            required
                        />
                    </div>

                    <!-- Password Field -->
                    <div class="form-group">
                        <label class="form-label" for="passwordInput">Password</label>
                        <div class="password-group">
                            <input 
                                class="form-input" 
                                type="password" 
                                id="passwordInput" 
                                placeholder="Enter password"
                                required
                            />
                            <button type="button" class="password-toggle" onclick="togglePassword()">
                                <svg class="icon icon-large" id="eyeIcon" viewBox="0 0 24 24">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button class="submit-btn" type="submit" id="submitBtn">
                        <span id="btnText">SIGN IN</span>
                    </button>
                </form>

                <!-- Toggle Login/Register -->
                <p class="toggle-text">
                    <span id="toggleQuestion">Don't have an account?</span>
                    <button class="toggle-btn" onclick="toggleMode()">
                        <span id="toggleAction">Sign Up</span>
                    </button>
                </p>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast" id="toast"></div>

    <script>
        let isLogin = true;
        let showPassword = false;

        // Toggle between Login and Register
        function toggleMode() {
            isLogin = !isLogin;
            
            const nameGroup = document.getElementById('nameGroup');
            const formTitle = document.getElementById('formTitle');
            const formSubtitle = document.getElementById('formSubtitle');
            const btnText = document.getElementById('btnText');
            const toggleQuestion = document.getElementById('toggleQuestion');
            const toggleAction = document.getElementById('toggleAction');
            const nameInput = document.getElementById('nameInput');
            
            if (isLogin) {
                nameGroup.classList.add('hidden');
                nameInput.removeAttribute('required');
                formTitle.textContent = 'Welcome Back';
                formSubtitle.textContent = 'Sign in to explore your collections';
                btnText.textContent = 'SIGN IN';
                toggleQuestion.textContent = "Don't have an account?";
                toggleAction.textContent = 'Sign Up';
            } else {
                nameGroup.classList.remove('hidden');
                nameInput.setAttribute('required', 'required');
                formTitle.textContent = 'Join VastraHub';
                formSubtitle.textContent = 'Create an account to start shopping';
                btnText.textContent = 'CREATE ACCOUNT';
                toggleQuestion.textContent = 'Already have an account?';
                toggleAction.textContent = 'Sign In';
            }
        }

        // Toggle password visibility
        function togglePassword() {
            showPassword = !showPassword;
            const passwordInput = document.getElementById('passwordInput');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (showPassword) {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        }

        // Handle form submission
        async function handleSubmit(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const name = document.getElementById('nameInput').value;
            
            // Disable button and show loading
            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span>';
            
            setTimeout(() => {
                submitBtn.disabled = false;
                btnText.textContent = isLogin ? 'SIGN IN' : 'CREATE ACCOUNT';
                
                if (isLogin) {
                    // Check if user exists in localStorage
                    const savedUser = JSON.parse(localStorage.getItem('vastraHub_user') || 'null');
                    
                    if (savedUser && savedUser.email === email && savedUser.password === password) {
                        // Save login session
                        localStorage.setItem('vastraHub_loggedIn', 'true');
                        localStorage.setItem('vastraHub_currentUser', JSON.stringify({ email: savedUser.email, name: savedUser.name }));
                        showToast('Welcome back, ' + savedUser.name + '!', 'success');
                        setTimeout(() => {
                            window.location.href = 'home.html';
                        }, 1500);
                    } else {
                        showToast('Invalid email or password!', 'error');
                        submitBtn.disabled = false;
                        btnText.textContent = 'SIGN IN';
                    }
                } else {
                    // Register - save user to localStorage
                    const newUser = { email, password, name };
                    localStorage.setItem('vastraHub_user', JSON.stringify(newUser));
                    localStorage.setItem('vastraHub_loggedIn', 'true');
                    localStorage.setItem('vastraHub_currentUser', JSON.stringify({ email, name }));
                    showToast('Account created successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 1500);
                }
            }, 1500);
            
            // Actual API call would look like:
            /*
            try {
                const endpoint = isLogin ? '/api/auth/login' : '/api/auth/register';
                const payload = isLogin ? { email, password } : { email, password, name };
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showToast(isLogin ? 'Welcome back!' : 'Account created!', 'success');
                    // Store user data and navigate
                    localStorage.setItem('user', JSON.stringify(data));
                    setTimeout(() => {
                        window.location.href = 'shop.html';
                    }, 1500);
                } else {
                    showToast(data.message || 'Authentication failed', 'error');
                }
            } catch (error) {
                showToast('Network error. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = isLogin ? 'SIGN IN' : 'CREATE ACCOUNT';
            }
            */
        }

        // Handle Google Login
        function handleGoogleLogin() {
            // Replace with actual Google OAuth implementation
            showToast('Google authentication coming soon!', 'success');
            
            // Actual implementation:
            // const redirectUrl = window.location.origin + '/shop.html';
            // window.location.href = `https://auth.emergentagent.com/?redirect=${encodeURIComponent(redirectUrl)}`;
        }

        // Go back to home
        function goBack() {
            window.location.href = 'lading.html';
        }

        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
